<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Нұрдәулет Холпий, инженер-программист">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="620" y2="0"><stop offset="0" stop-color="#5b7cff"/><stop offset=".6" stop-color="#35d6f2"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5b7cff" stroke-opacity=".14"/></pattern>
<radialGradient id="glow" cx=".82" cy=".5" r=".55"><stop offset="0" stop-color="#5b7cff" stop-opacity=".35"/><stop offset="1" stop-color="#5b7cff" stop-opacity="0"/></radialGradient>
<clipPath id="reveal"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" values="0;640;640;0" keyTimes="0;.4;.8;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1000" height="320" rx="18" fill="#0b1020"/><rect width="1000" height="320" rx="18" fill="url(#grid)"/><rect width="1000" height="320" rx="18" fill="url(#glow)"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="-3">
<g fill="none" stroke="#8ea2ff" stroke-opacity=".55" stroke-width="1.2"><text x="56" y="138" >Нұрдәулет</text><text x="56" y="228" >Холпий</text></g>
<g clip-path="url(#reveal)" fill="url(#g)"><text x="56" y="138" >Нұрдәулет</text><text x="56" y="228" >Холпий</text></g>
</g>
<rect x="-4" y="50" width="2" height="190" fill="#35d6f2"><animate attributeName="x" values="-4;640;640;-4" keyTimes="0;.4;.8;1" dur="9s" repeatCount="indefinite"/></rect>
<circle cx="64" cy="46" r="4" fill="#3ddc97"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
<text x="80" y="51" font-family="Consolas,Menlo,Monaco,'Courier New',monospace" font-size="15" fill="#8a96b8">Алматы, открыт к предложениям</text>
<text x="58" y="285" font-family="Consolas,Menlo,Monaco,'Courier New',monospace" font-size="19" fill="#8a96b8">Инженер-программист: Java, Python, PostgreSQL</text>
<polygon points="870.0,150.0 835.0,210.6 765.0,210.6 730.0,150.0 765.0,89.4 835.0,89.4" fill="none" stroke="#8ea2ff" stroke-width="2"/>
<polygon points="930.0,190.0 895.0,250.6 825.0,250.6 790.0,190.0 825.0,129.4 895.0,129.4" fill="#35d6f2" fill-opacity=".07" stroke="#35d6f2" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/></polygon>
<path d="M800 150L860 190" stroke="#ffb547" stroke-opacity=".6" stroke-dasharray="3 5"/>
<circle r="5" fill="#ffb547"><animateMotion dur="2.5s" repeatCount="indefinite" path="M800 150L860 190"/></circle>
<text x="830" y="296" text-anchor="middle" font-family="Consolas,Menlo,Monaco,'Courier New',monospace" font-size="14" fill="#8a96b8">объект и его цифровой двойник</text>
</svg>